name: Housing Connect Relay

on:
  schedule:
    # Every 15 minutes — matches the Worker's cron watchdog window
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Manual trigger for testing; pings healthcheck just like the scheduled run

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Restore the photo-hash cache from the most recent run.
      # Using separate restore/save actions so we can always save even when
      # the relay script exits non-zero (errors on individual listings).
      # Key includes run_number so each run writes a fresh cache entry;
      # restore-keys picks the latest existing one by prefix.
      - name: Restore photo hash cache
        uses: actions/cache/restore@v4
        with:
          path: photo-hashes.json
          key: photo-hashes-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            photo-hashes-${{ runner.os }}-

      - name: Fetch HC data and POST to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: node relay.mjs

      - name: Save photo hash cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: photo-hashes.json
          key: photo-hashes-${{ runner.os }}-${{ github.run_number }}

name: Monthly Keepalive

on:
  schedule:
    # 1st of every month at 09:00 UTC — prevents GitHub's 60-day inactivity auto-disable
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: monthly keepalive [skip ci]"
          git push
